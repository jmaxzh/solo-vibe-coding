name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'skills/solo-vibe-coding/**'
      - 'i18n/zh-CN/skills/solo-vibe-coding/**'
      - '.github/workflows/website.yml'
      - 'README*'
      - 'CONSTRAINTS.md'
      - 'docs/**'
      - '!docs/research/**'
  pull_request:
    paths:
      - 'website/**'
      - 'skills/solo-vibe-coding/**'
      - 'i18n/zh-CN/skills/solo-vibe-coding/**'
      - '.github/workflows/website.yml'
      - 'README*'
      - 'CONSTRAINTS.md'
      - 'docs/**'
      - '!docs/research/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check types, build, and verify generated pages
        run: npm run validate
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Verify interactions, accessibility, and mobile layouts
        run: npm run test:e2e
      - name: Upload only the generated website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist
          retention-days: 1

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
